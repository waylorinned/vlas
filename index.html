<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Влад Тапалка</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle, #1a1a2e 0%, #0f0f1b 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      color: #f39c12;
      text-shadow: 0 0 10px rgba(243, 156, 18, 0.4);
    }

    .score-container {
      font-size: 38px;
      font-weight: bold;
      margin-top: 5px;
      letter-spacing: 1px;
    }

    .stats {
      font-size: 14px;
      color: #aaa;
      margin-top: 4px;
    }

    /* Кликерная зона */
    .tap-area {
      position: relative;
      margin: 20px 0;
    }

    .vlad-avatar {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff7675, #d63031);
      border: 5px solid #fdcb6e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(253, 203, 110, 0.3);
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.08s ease;
    }

    .vlad-avatar:active {
      transform: scale(0.92);
      filter: brightness(1.15);
    }

    .vlad-face {
      font-size: 60px;
    }

    .vlad-name {
      font-size: 15px;
      font-weight: bold;
      margin-top: -6px;
      letter-spacing: 1px;
    }

    /* Всплывающие цифры */
    .floating-text {
      position: absolute;
      font-size: 24px;
      font-weight: bold;
      color: #ffeaa7;
      pointer-events: none;
      animation: floatUp 0.7s ease-out forwards;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -60px) scale(1.3);
      }
    }

    /* Магазин улучшений */
    .shop {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .upgrade-btn {
      background: #252836;
      border: 1px solid #3b3f54;
      border-radius: 12px;
      padding: 12px 16px;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, opacity 0.2s;
    }

    .upgrade-btn:hover:not(:disabled) {
      background: #2e3244;
      border-color: #f39c12;
    }

    .upgrade-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .up-info {
      text-align: left;
    }

    .up-name {
      font-weight: bold;
      font-size: 15px;
    }

    .up-desc {
      font-size: 12px;
      color: #8b8ea0;
    }

    .up-cost {
      font-weight: bold;
      color: #fdcb6e;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">VLAD TAP</div>
    <div class="score-container" id="score">0</div>
    <div class="stats">
      За клик: +<span id="per-click">1</span> | Автокликер: <span id="auto-rate">0</span>/сек
    </div>
  </div>

  <div class="tap-area" id="tap-area">
    <div class="vlad-avatar" id="vlad-btn">
      <div class="vlad-face">😎</div>
      <div class="vlad-name">ВЛАД</div>
    </div>
  </div>

  <div class="shop">
    <button class="upgrade-btn" id="btn-click-up" onclick="buyClickUpgrade()">
      <div class="up-info">
        <div class="up-name">Мощный Тап</div>
        <div class="up-desc">+1 к силе клика</div>
      </div>
      <div class="up-cost" id="click-cost">15 🪙</div>
    </button>

    <button class="upgrade-btn" id="btn-bot-1" onclick="buyAutoClicker(1, 50, 1)">
      <div class="up-info">
        <div class="up-name">Кореш Влада</div>
        <div class="up-desc">+1 монета в секунду</div>
      </div>
      <div class="up-cost" id="bot1-cost">50 🪙</div>
    </button>

    <button class="upgrade-btn" id="btn-bot-2" onclick="buyAutoClicker(2, 250, 8)">
      <div class="up-info">
        <div class="up-name">Монтажер роликов</div>
        <div class="up-desc">+8 монет в секунду</div>
      </div>
      <div class="up-cost" id="bot2-cost">250 🪙</div>
    </button>

    <button class="upgrade-btn" id="btn-bot-3" onclick="buyAutoClicker(3, 1000, 40)">
      <div class="up-info">
        <div class="up-name">Студия контента</div>
        <div class="up-desc">+40 монет в секунду</div>
      </div>
      <div class="up-cost" id="bot3-cost">1000 🪙</div>
    </button>
  </div>

  <script>
    let score = 0;
    let clickPower = 1;
    let autoIncome = 0;

    let clickCost = 15;
    let botCosts = { 1: 50, 2: 250, 3: 1000 };

    const scoreEl = document.getElementById('score');
    const perClickEl = document.getElementById('per-click');
    const autoRateEl = document.getElementById('auto-rate');
    const tapArea = document.getElementById('tap-area');
    const vladBtn = document.getElementById('vlad-btn');

    // Клик по Владу
    vladBtn.addEventListener('pointerdown', (e) => {
      score += clickPower;
      updateUI();
      spawnFloatingText(e.clientX, e.clientY, `+${clickPower}`);
    });

    function spawnFloatingText(x, y, text) {
      const el = document.createElement('div');
      el.className = 'floating-text';
      el.innerText = text;

      const rect = tapArea.getBoundingClientRect();
      el.style.left = `${x - rect.left}px`;
      el.style.top = `${y - rect.top}px`;

      tapArea.appendChild(el);
      setTimeout(() => el.remove(), 700);
    }

    // Прокачка клика
    function buyClickUpgrade() {
      if (score >= clickCost) {
        score -= clickCost;
        clickPower += 1;
        clickCost = Math.round(clickCost * 1.5);
        document.getElementById('click-cost').innerText = `${clickCost} 🪙`;
        updateUI();
      }
    }

    // Автокликеры
    function buyAutoClicker(id, baseCost, income) {
      if (score >= botCosts[id]) {
        score -= botCosts[id];
        autoIncome += income;
        botCosts[id] = Math.round(botCosts[id] * 1.4);
        document.getElementById(`bot${id}-cost`).innerText = `${botCosts[id]} 🪙`;
        updateUI();
      }
    }

    // Автофарм каждую секунду
    setInterval(() => {
      if (autoIncome > 0) {
        score += autoIncome;
        updateUI();
      }
    }, 1000);

    function updateUI() {
      scoreEl.innerText = score;
      perClickEl.innerText = clickPower;
      autoRateEl.innerText = autoIncome;

      // Блокировка кнопок при нехватке монет
      document.getElementById('btn-click-up').disabled = score < clickCost;
      document.getElementById('btn-bot-1').disabled = score < botCosts[1];
      document.getElementById('btn-bot-2').disabled = score < botCosts[2];
      document.getElementById('btn-bot-3').disabled = score < botCosts[3];
    }

    updateUI();
  </script>
</body>
</html>
